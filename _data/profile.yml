introduction: |
  **Dr. Leonid Kostrykin** is a postdoctral researcher in the [Biomedical Computer Vision Group](https://www.bioquant.uni-heidelberg.de/groups/rohr) at Heidelberg University. His main interests are globally optimal methods for computer vision. As the [ELIXIR Germany Officer](https://www.denbi.de/team-elixir-officers) of the [Heidelberg Center for Human Bioinformatics (HD-HuB)](https://www.hd-hub.de), he drives new developments of image analysis tools for [Galaxy Europe](https://usegalaxy.eu) and [Bioconda](https://bioconda.github.io).

projects:

  - title: Expanding [Galaxy Europe](https://usegalaxy.eu) and [Bioconda](https://bioconda.github.io)
    id: galaxy
    year_started: 2022
    description: We contribute state-of-the-art image analysis tools to the [Galaxy Project](https://galaxyproject.org) and [Conda ecosystem](https://anaconda.org/anaconda/conda), to make recent image analysis methods accessible for everyone, and to facilitate further research.

  - title: Image Analysis for Visual Inspection of Electric Generators
    id: registration
    year_started: 2019
    description: We are concerned with the development of methods for large-scale image stitching of video data, acquired by small robots under low-light conditions to facilitate the inspection process of electric generators.

  - title: Globally Optimal Segmentation using Shape and Intensity Information
    id: segmentation
    year_started: 2016
    description: We develop new globally optimal model-based methods for segmentation of cell nuclei. Our latest method that is SuperDSM, leverages superadditivity and deformable shape models. The method was published in IEEE TPAMI and presented at the DAGM GCPR.


