  - type: training
    title: Microscopy Image Analysis Course 2023
    cover: https://www.bioquant.uni-heidelberg.de/sites/default/files/2025-05/MicrIA23_group_photo.jpg
    text: |
      **August 2023.** We have delivered a training course on Microscopy Image Analysis. In this course, we gave an introduction into the field of microscopy image analysis using automated software tools (ImageJ and Galaxy). The course was attended by 17 participants, including scientists from Germany and Italy.

      Links:
      <https://www.bioquant.uni-heidelberg.de/groups/rohr/micria-2023>
      <https://www.denbi.de/training-archive-sorted-according-by-date/1574-microscopy-image-analysis-course-2023>
