items:

  - type: paper
    project: galaxy
    publication: kostrykin2026
    text: |
      **September 2026.** Our article "Bioimage Management and Analysis in Galaxy: Tools, Workflows, Training, and Community Practices" has been published in the Journal of Microscopy (Wiley). The article describes Galaxy as a computational workbench for bioimage data management and analysis and the community practices that have emerged in the past years.

  - type: galaxy
    project: galaxy
    title: Talk at the Galaxy Community Conference 2026
    text: |
      **June 2026.** We have contributed a talk on Galaxy Image Analysis for the [Galaxy Community Conference 2026](https://galaxyproject.org/events/gcc2026), that was held at the University Clermont Auvergne in Clermont-Ferrand (France) this year. The talk was entitled "Galaxy Image Analysis: A Decade of Development for Cell Microscopy Image Analysis and Beyond" and covered the highlights of ten years of development of Galaxy Image Analysis, that is a software suite for web-based image analysis of cell microscopy images, that started in 2016.

      The talk featured example workflows from cell microscopy research conducted with Galaxy Image Analysis (Föll et al. 2019, Liu et al. 2022, Wang et al. 2022) and included an example workflow for segmentation of anatomical structures from medical imaging. We also introduced the [Galaxy Image Analysis Auxilliary Library](https://github.com/bmcv/giatools) to a wider audience, which poses the technical backbone for a wide range of different high-dimensional image representations and image file formats.

      <div class="youtube-thumbnail fluid-iframe" data-thumbnail="/assets/gcc-2026.png" data-title="Galaxy Image Analysis: A Decade of Development for Cell Microscopy Image Analysis and Beyond" data-logo="/assets/yt-GalaxyProject.png"><iframe src="https://www.youtube-nocookie.com/embed/e10XFwUu1vc?si=fKmOkrXn8oRT9J5N&amp;start=14699&enablejsapi=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>

  - type: galaxy
    project: galaxy
    title: Project on Image Analysis in Galaxy at the BioHackathon Europe 2025
    cover: /assets/bheu2025.jpg
    text: |
      **November 2025.** With the project entitled "Evolving FAIR image analysis in Galaxy for cross-domain and AI-ready applications" and lead by Dr. Kostrykin, it has been three years in a row that the community for image analysis in Galaxy succeeded with a project at the [BioHackathon Europe](https://biohackathon-europe.org): 

      - [Enhancing the image analysis community in Galaxy](https://osf.io/w8dsz) (2023, online participation)
      - [Development of FAIR image analysis workflows and training in Galaxy](https://osf.io/hbw6m_v1) (2024, nominated participant, Barcelona, Spain)
      - [Evolving FAIR image analysis in Galaxy for cross-domain and AI-ready applications](https://github.com/elixir-europe/biohackathon-projects-2025/blob/main/9.md) (2025, project lead, Berlin, Germany)

      The five-days hackathon is organized annualy by [ELIXIR](https://elixir-europe.org). Within the 2025 project, we have been able to align joint efforts from [Euro-BioImaging](https://www.eurobioimaging.eu), [OSCARS FIESTA](https://oscars-project.eu/projects/fair-image-analysis-across-sciences), and [OSCARS BIO-CODES](https://oscars-project.eu/projects/bio-codes-enhancing-ai-readiness-bioimaging-data-content-based-identifiers) to further advance the ecosystem for image analysis in Galaxy.

  - type: training
    project: galaxy
    title: Webinar Series on Image Analysis in Galaxy
    text: |
      **April 2025.** This spring, we have delivered three webinars on image analysis in [Galaxy](https://galaxyproject.org). Our contributions for the [GloBIAS Bioimage Analysis Seminar Series](https://www.globias.org/activities/bia-seminar-series#h.8hkvvz3f30o8) and the [EMBL EBI Course on Microscopy Data Analysis](https://www.ebi.ac.uk/training/events/microscopy-data-analysis-2025/#vf-tabs__section--tab2) were attended by respectively about 50 and 40 scientists from across the globe. The GloBIAS webinar was concluded by an extensive Q&amp;A that is now available on the [Image.SC Forums](https://forum.image.sc/t/globias-bioimage-analysis-seminar-series-image-analysis-using-galaxy/109386). Our third contriubtion was for the [Euro-BioImaging Image Data Community Days 2025](https://www.eurobioimaging.eu/events/image-data-community-days) and had about 90 attendees from across Europe.

      <div class="youtube-thumbnail fluid-iframe" data-thumbnail="/assets/galaxy-webinars-spring-2025.jpg" data-title="Image Analysis using Galaxy by B. Serrano-Solano, A. Fouilloux, L. Kostrykin, R. Massei" data-logo="/assets/yt-globias.png"><iframe src="https://www.youtube-nocookie.com/embed/wAHOPT6lRV0?si=udjQ48FqQ-xHZ72A&amp;start=217&enablejsapi=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>

