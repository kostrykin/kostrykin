items:

  - type: hackathon
    title: Galaxy Image Analysis Project Accepted for the BioHackathon Europe 2025
    cover: /assets/bheu2024.jpg
    text: |
      **June 2025.** The project submission lead by Dr. Kostrykin and entitled "Evolving FAIR image analysis in Galaxy for cross-domain and AI-ready applications" for the upcoming [BioHackathon Europe 2025](https://biohackathon-europe.org) has been accepted. The hackathon is organized by [ELIXIR](https://elixir-europe.org). Following the previous projects

      - [Enhancing the image analysis community in Galaxy](https://osf.io/w8dsz) (2023, online participation)
      - [Development of FAIR image analysis workflows and training in Galaxy](https://osf.io/hbw6m_v1) (2024, nominated participant, Barcelona, Spain)

      this will be the third year in a row that a project focusing on image analysis in Galaxy will be held at the BioHackathon Europe, and the first year that Dr. Kostrykin will participate as a project lead.

  - type: training
    title: Webinar Series on Image Analysis in Galaxy
    text: |
      **Spring 2025.** This spring, we have delivered a broadside of three webinars on image analysis using [Galaxy](https://galaxyproject.org) for three internationally acknowledged institutions. Our first contribution was for the [GloBIAS Bioimage Analysis Seminar Series](https://www.globias.org/activities/bia-seminar-series#h.8hkvvz3f30o8), that was attended by about 50 scientists from across the globe, and was concluded by an extensive Q&amp;A that is now available on the [Image.SC Forums](https://forum.image.sc/t/globias-bioimage-analysis-seminar-series-image-analysis-using-galaxy/109386). The second contribution was for the [EMBL EBI Course on Microscopy Data Analysis](https://www.ebi.ac.uk/training/events/microscopy-data-analysis-2025/#vf-tabs__section--tab2) and reached an audience of about 40 attendees world-wide. Our third contriubtion was for the [Euro-BioImaging Image Data Community Days 2025](https://www.eurobioimaging.eu/events/image-data-community-days) and had about 90 attendees from across Europe.

      <div class="youtube-thumbnail fluid-iframe" data-thumbnail="/assets/galaxy-webinars-spring-2025.jpg" data-title="Image Analysis using Galaxy by B. Serrano-Solano, A. Fouilloux, L. Kostrykin, R. Massei" data-logo="/assets/yt-globias.png"><iframe src="https://www.youtube-nocookie.com/embed/wAHOPT6lRV0?si=udjQ48FqQ-xHZ72A&amp;start=217&enablejsapi=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>

  - type: patent
    title: Method and Device for Monitoring the State of a Component
    text: |
      **September 2024.** Following its acceptance as an international patent, our patent application "Method and Device for Monitoring the State of a Component" has now also been registered as a US patent under the Publication Number [US 2024/0296573 A1](https://patentimages.storage.googleapis.com/cc/a6/73/d27918c20cd3d7/US20240296573A1.pdf).

      In 2023, our patent "Method and Device for Monitoring the State of a Component" was already granted and published under the Patent Cooperation Treaty (PCT) by the World Intellectual Property Organization (WIPO) under the International Publication Number [WO 2023/025570 A1](https://depatisnet.dpma.de/DepatisNet/depatisnet?window=1&space=menu&content=treffer&action=pdf&docid=WO002023025570A1&xxxfull=1).

      Both patents are based on our previous publication "Globally Optimal and Scalable Video Image Stitching for Robotic Inspection of Electric Generators"([Kostrykin et al. ICCAS 2021](/publications#kostrykin2021)).

  - type: paper
    publication: kostrykin2024
    text: |
      **May 2024.** Our conference paper "Robust Graph Pruning for Efficient Segmentation and Cluster Splitting of Cell Nuclei using Deformable Shape Models" has been presented at the IEEE ISBI 2024 in Athens, Greece. This contribution significantly improves the efficiency SuperDSM, our previously published method for cell nuclei segmentation using superadditivity and deformable shapre models.

      The software is publically available on [Galaxy Europe](https://usegalaxy.eu/root?tool_id=toolshed.g2.bx.psu.edu/repos/imgteam/superdsm/ip_superdsm), [Bioconda](https://anaconda.org/bioconda/superdsm), and [GitHub](https://github.com/BMCV/SuperDSM).
    photos:
      - /assets/isbi2024a.jpg
      - /assets/isbi2024b.jpg

  - type: paper
    publication: kostrykin2023
    text: |
      **March 2023.** Our article "Superadditivity and Convex Optimization for Globally Optimal Cell Segmentation Using Deformable Shape Models" has been published in IEEE TPAMI (vol. 45, no. 3). The article introduces SuperDSM, a new globally optimal method for segmentation of cell nuclei using superadditivity and deformable shape models. Some corrections can be found [here](/notes/notes/kostrykin2023).

      SuperDSM is publically available on [Galaxy Europe](https://usegalaxy.eu/root?tool_id=toolshed.g2.bx.psu.edu/repos/imgteam/superdsm/ip_superdsm), [Bioconda](https://anaconda.org/bioconda/superdsm), and [GitHub](https://github.com/BMCV/SuperDSM). The work has also been presented on the Nectar Track of the German Conference for Pattern Recognition (DAGM GCPR 2023) in Heidelberg, Germany.
    photos:
      - /assets/gcpr2023a.jpg
      - /assets/gcpr2023b.jpg

  - type: training
    title: Microscopy Image Analysis Course 2023
    cover: https://www.bioquant.uni-heidelberg.de/sites/default/files/2025-05/MicrIA23_group_photo.jpg
    text: |
      **August 2023.** We have delivered a training course on Microscopy Image Analysis. In this course, we gave an introduction into the field of microscopy image analysis using automated software tools (ImageJ and Galaxy). The course was attended by 17 participants, including scientists from Germany and Italy.

      Links:
      <https://www.bioquant.uni-heidelberg.de/groups/rohr/micria-2023>
      <https://www.denbi.de/training-archive-sorted-according-by-date/1574-microscopy-image-analysis-course-2023>

